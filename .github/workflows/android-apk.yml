
name: Build Exercise BESS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-package-lock
          npm install --legacy-peer-deps --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          
      - name: Build web application
        run: npm run build

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.exercisebess.rehab",
            "appName": "Exercise BESS",
            "webDir": "dist"
          }
          EOF

      - name: Generate Android application
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exercise-BESS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
